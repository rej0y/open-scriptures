[package]
name = "open-scriptures"
version = "0.1.0"
description = "Open Scriptures desktop application"
authors = ["Open Scriptures contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "open_scriptures_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
